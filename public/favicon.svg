<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Circular Background -->
  <circle cx="256" cy="256" r="256" fill="#000000" />
  
  <!-- Outer C Shape -->
  <path 
    d="M 358 168 A 140 140 0 1 0 358 344" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="38" 
    stroke-linecap="round" 
  />
  
  <!-- Plus Sign Outer Shadow/Border -->
  <g fill="#2B2D33" stroke="#000000" stroke-width="4">
    <rect x="200" y="238" width="112" height="42" rx="18" />
    <rect x="235" y="203" width="42" height="112" rx="18" />
  </g>

  <!-- Plus Sign Main Body (Grey) -->
  <g fill="#9CA3AF" stroke="#22252A" stroke-width="3">
    <rect x="202" y="236" width="108" height="38" rx="16" />
    <rect x="237" y="201" width="38" height="108" rx="16" />
  </g>
  
  <!-- Plus Sign Highlight Overlay -->
  <g fill="#B0B7C3">
    <rect x="204" y="237" width="104" height="18" rx="9" opacity="0.3" />
  </g>
</svg>
